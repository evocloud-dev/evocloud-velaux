# VelaUX branding for EvoCloud. VelaUX reads this ConfigMap on every page load;
# the same fields can be edited in the UI under Settings > Customisation.
#   logoURL       wordmark: sidebar header and login page (drawn for a light background;
#                 on a dark sidebar VelaUX puts it on a white plate)
#   iconURL       mark: minimised sidebar and browser tab
#   sidebarColor  sidebar background; text colour follows its lightness
#   accentColor   current page and highlights in the sidebar, modal headers
# Sources, copied from Documents/HeadLamp: evocloud-wordmark.svg (Artboard 2Horizontal.svg)
# and evocloud-icon.svg (FavLogo.svg), both in this folder.
apiVersion: v1
kind: ConfigMap
metadata:
  name: velaux-configuration
  namespace: vela-system
data:
  pageTitle: EvoCloud
  sidebarColor: "#0b1120"
  accentColor: "#F7B500"
  logoURL: data:image/svg+xml;base64,
  iconURL: data:image/svg+xml;base64,
